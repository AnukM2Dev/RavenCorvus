name: RavenCorvus
version: "0.3.1"
slug: ravencorvus
description: Home Assistant MCP server with a Cloudflare tunnel for remote access (claude.ai connector)
url: https://github.com/AnukM2Dev/RavenCorvus
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant_api: true
# No ports are exposed: cloudflared makes an outbound connection, and ha-mcp listens on 127.0.0.1 only.
options:
  tunnel_token: ""
  ha_token: ""
  use_supervisor_api: true
  ha_url: "http://homeassistant:8123"
  public_hostname: "rc.ravenswoodfarmstead.com"
  path_secret: ""
  access_team: ""
  access_aud: ""
  read_only: true
  denied_entities: ""
  allowed_domains: ""
  allow_sensitive_domains: ""
  anthropic_api_key: ""
  anthropic_base_url: ""
  watch_model: "claude-haiku-5-5"
  watch_notify_service: ""
  watch_times: "08:00,18:00"
  watch_nightly_time: "03:00"
schema:
  tunnel_token: password
  use_supervisor_api: bool
  ha_token: password?
  ha_url: str
  public_hostname: str
  path_secret: password?
  access_team: str?
  access_aud: str?
  read_only: bool
  denied_entities: str?
  allowed_domains: str?
  allow_sensitive_domains: str?
  anthropic_api_key: password?
  anthropic_base_url: str?
  watch_model: str?
  watch_notify_service: str?
  watch_times: str?
  watch_nightly_time: str?
