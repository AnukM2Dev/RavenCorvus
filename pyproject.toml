[project]
name = "ravencorvus"
version = "0.2.0"
description = "MCP server and CLI for Home Assistant (REST + WebSocket) with an operator-controlled write guard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "mcp>=1.2",
    "uvicorn>=0.30",
]

[project.scripts]
ha-mcp = "ha_mcp.server:main"
ha = "ha_mcp.cli:main"
ha-watch = "ha_mcp.watch:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
