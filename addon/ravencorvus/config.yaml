name: RavenCorvus
version: "0.2.0"
slug: ravencorvus
description: Guarded Home Assistant MCP server for Claude, served over streamable HTTP.
url: https://github.com/AnukM2Dev/RavenCorvus
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:8765]/healthz
# Not published on the host. The Cloudflared app reaches it on the internal
# network at http://local-ravencorvus:8765.
ports:
  8765/tcp: null
ports_description:
  8765/tcp: MCP endpoint (leave blank; reach it through the tunnel)
options:
  ha_token: ""
  api_key: ""
  access_team: ""
  access_aud: ""
  read_only: false
  allowed_domains: []
  denied_entities: []
  allow_sensitive_domains: []
  allowed_hosts: []
  path_key: false
schema:
  ha_token: password
  api_key: password
  access_team: str?
  access_aud: str?
  read_only: bool
  allowed_domains:
    - str
  denied_entities:
    - str
  allow_sensitive_domains:
    - str
  allowed_hosts:
    - str
  path_key: bool
